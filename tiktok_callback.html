<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Authorization — APEXBOUTS</title>
<style>
  :root{--ink:#1C1614;--dust:#D9CBB3;--dust-dim:#9C8E78;--gold:#D4A017;--rule:#3B302A;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--dust);font-family:system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .card{max-width:32rem;width:100%}
  h1{font-size:1.4rem;margin:0 0 1.5rem}
  .code-box{background:#000;border:1px solid var(--rule);border-radius:6px;padding:1rem;
            font-family:ui-monospace,Consolas,monospace;font-size:.95rem;word-break:break-all;
            margin-bottom:1rem;user-select:all}
  button{background:var(--gold);color:var(--ink);border:none;border-radius:6px;
         padding:.7rem 1.2rem;font-size:1rem;font-weight:600;cursor:pointer}
  button:hover{opacity:.9}
  .error{color:#e08080}
  .hint{color:var(--dust-dim);font-size:.9rem;margin-top:1rem}
</style>
</head>
<body>
<div class="card">
  <h1>TikTok Authorization</h1>
  <div id="output">Reading response…</div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const out = document.getElementById("output");

  if (error) {
    out.innerHTML = '<p class="error">TikTok returned an error: ' + error + '</p>' +
      '<p>Go back to the terminal and try again.</p>';
  } else if (code) {
    out.innerHTML =
      '<p>Copy this code and paste it into the terminal:</p>' +
      '<div class="code-box" id="codeBox">' + code + '</div>' +
      '<button onclick="copyCode()">Copy code</button>' +
      '<p class="hint">state: ' + (state || '(none)') + '</p>';
  } else {
    out.innerHTML = '<p class="error">No authorization code found in the URL.</p>';
  }

  function copyCode() {
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.querySelector("button");
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = "Copy code", 1500);
    });
  }
</script>
</body>
</html>
